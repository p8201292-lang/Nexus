    .brand { display: flex; align-items: center; gap: 10px; }

    .menu { display: flex; gap: 26px; font-weight: 500; color: var(--muted); }

    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1.1rem; cursor: pointer; }

    /* Buttons */
    .btn { display: inline-block; padding: 12px 22px; border-radius: 12px; font-weight: 600; border: 2px solid transparent; cursor: pointer; transition: transform .15s, box-shadow .2s; }

    .hero p { margin-top: 18px; color: var(--muted); font-size: 1.1rem; max-width: 52ch; }
    .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .hero .note { font-size: .85rem; margin-top: 18px; }
    .hero-art img { background: #fff; border-radius: 28px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }

    /* Statistics */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 1000px; margin: 20px auto 0; padding: 0 5vw; text-align: center; }

    .stats span { color: var(--muted); font-size: .9rem; }

    .lead { color: var(--muted); margin-top: 10px; max-width: 62ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }

    .card p { color: var(--muted); font-size: .97rem; }
    .tag { display: inline-block; margin-top: 14px; font-size: .78rem; padding: 4px 10px; border-radius: 99px; border: 1px dashed var(--purple); color: var(--purple); }

    .lvl-b { background: rgba(6, 182, 212, .15); color: var(--cyan); }
    .lvl-i { background: rgba(37, 99, 235, .15); color: var(--blue); }
    .lvl-a { background: rgba(124, 58, 237, .15); color: var(--purple); }
